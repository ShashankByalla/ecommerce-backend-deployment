name: Docker Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Backend Docker Image
        run: |
          cd backend
          docker-compose build
          
      - name: Build Frontend Docker Image  
        run: |
          cd frontend
          docker-compose build
